          - type: string
            format: date-time
          - type: 'null'
          title: Last Seen At
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - id
      - status
      - created_at
      title: DeviceResponse
    DeviceUpdate:
      properties:
        name:
          anyOf:
          - type: string
            maxLength: 128
          - type: 'null'
          title: Name
        status:
          anyOf:
          - type: string
            maxLength: 32
          - type: 'null'
          title: Status
        firmware_version:
          anyOf:
          - type: string
            maxLength: 32
          - type: 'null'
          title: Firmware Version
      type: object
      title: DeviceUpdate
    HTTPValidationError:
      properties:
