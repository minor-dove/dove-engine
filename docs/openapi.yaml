        timezone:
          anyOf:
          - type: string
          - type: 'null'
          title: Timezone
        morning_time:
          anyOf:
          - type: string
            pattern: ^\d{2}:\d{2}$
          - type: 'null'
          title: Morning Time
        midday_time:
          anyOf:
          - type: string
            pattern: ^\d{2}:\d{2}$
          - type: 'null'
