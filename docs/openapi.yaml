  /api/v1/stress/days/{day}:
    get:
      tags:
      - Stress
      summary: Day Report
      operationId: day_report_api_v1_stress_days__day__get
      parameters:
      - name: day
        in: path
        required: true
        schema:
          type: string
          format: date
          title: Day
      - name: device_id
        in: query
        required: false
        schema:
          type: string
          default: dove-esp32-01
          title: Device Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Day Report Api V1 Stress Days  Day  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /health:
    get:
      tags:
      - Health
      summary: Health Check
      description: 'System health check.

        Validates application readiness, database connectivity, and MQTT broker state.'
      operationId: health_check_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /:
    get:
      tags:
      - Root
      summary: Root Redirect
      description: Root redirect with service metadata.
      operationId: root_redirect__get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
components:
  schemas:
    AnswerRequest:
