          type: string
          format: date-time
          title: Recorded At
          description: UTC timestamp of the observation on the edge device
      additionalProperties: false
      type: object
      required:
      - event_id
      - device_id
      - mood_id
      - recorded_at
      title: MoodEventCreate
      description: 'Payload sent by the ESP32 edge device every minute.

        Contains ONLY classification ID and metadata.'
