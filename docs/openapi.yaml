          - type: string
          - type: 'null'
          title: Session Id
        message_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Message Id
        content:
          type: string
          title: Content
        is_active:
          type: boolean
          title: Is Active
        is_false_trigger:
