    MoodEventCreate:
      properties:
        event_id:
          type: string
          maxLength: 128
          minLength: 1
          title: Event Id
          description: Unique client-generated event UUID for deduplication
        device_id:
          type: string
          maxLength: 64
          minLength: 1
          title: Device Id
          description: Device serial or identifier
        mood_id:
          type: integer
          maximum: 6.0
          minimum: 0.0
          title: Mood Id
          description: 0:Angry, 1:Disgust, 2:Fear, 3:Happy, 4:Sad, 5:Surprise, 6:Neutral
